<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2322a06b'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/"><span class="logo"></span>Soccer Lab</a>
    <nav id="nav">
      <a href="#/" data-v="overview">Overview</a>
      <a href="#/live" data-v="live">Live</a>
      <a href="#/runs" data-v="runs">Runs</a>
      <a href="#/compare" data-v="compare">Compare</a>
      <a href="#/queue" data-v="queue">Queue</a>
      <a href="#/pi" data-v="pi">Raspberry Pi</a>
    </nav>
    <button id="theme" class="theme-btn" title="Light / dark" aria-label="Switch light or dark theme">☀</button>
    <div id="pulse" class="pulse" title="Connection to the Pi"><i></i><span>connecting</span></div>
  </div>
</header>
<main id="view"><div class="empty">Loading…</div></main>
<div id="tip" class="tip" hidden></div>
<footer>Read-only · refreshes every 10 s · <a href="/results.md">results.md</a> · <a href="/api/overview">api</a></footer>
<script src="app.js"></script>
</body>
</html>
