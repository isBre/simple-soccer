<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soccer Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%233cc488'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>try { if (localStorage.getItem("theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}</script>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/"><span class="logo"></span>Soccer Lab</a>
    <nav class="nav">
      <a href="#/" data-v="now">Now</a>
      <a href="#/live" data-v="live">Live</a>
      <a href="#/runs" data-v="runs">Runs</a>
      <a href="#/compare" data-v="compare">Compare</a>
    </nav>
    <input id="picker" class="picker" list="runlist" placeholder="Jump to run…  /" aria-label="Jump to a run"><datalist id="runlist"></datalist>
    <a id="pichip" class="pichip" href="#/pi" data-v="pi" title="Raspberry Pi">Pi</a>
    <button id="theme" class="theme-btn" title="Light / dark" aria-label="Switch light or dark theme">☀</button>
    <span id="pulse" class="pulse" title="Connection to the Pi"><i></i></span>
  </div>
</header>
<nav class="rail" aria-label="Pages">
  <a href="#/live" data-v="live"><span>▶</span>Live</a>
  <a href="#/" data-v="now"><span>◉</span>Now</a>
  <a href="#/runs" data-v="runs"><span>☰</span>Runs</a>
  <a href="#/pi" data-v="pi"><span>⚙</span>Pi</a>
</nav>
<div id="offline" class="offline" hidden></div>
<main id="view"><div class="empty">Loading…</div></main>
<div id="tip" class="tip" hidden></div>
<footer>Read-only · refreshes every 10 s · <a href="/api/v1">API</a> · <a href="/results.md">results.md</a> · agents: <span class="mono">python3 rl/lab.py -h</span></footer>
<script src="app.js"></script>
</body>
</html>
