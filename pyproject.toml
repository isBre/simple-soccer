# The project's dependencies and packages. Install it once into a venv (README "Setup"):
#   python3 -m venv .venv && .venv/bin/pip install -e '.[train]'
# then every script runs as `python3 <dir>/<script>.py` with the venv active (source .venv/bin/activate) or as .venv/bin/python <dir>/<script>.py.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-soccer"
version = "0.1.0"
description = "Haxball-style 5v5 football: match core, rule-based and RL teams, the web game and the experiment Lab"
dependencies = ["numpy"]              # the match core, the game, evaluations and the Lab

[project.optional-dependencies]
train = ["torch"]                     # rl/selfplay.py, rl/ppo.py, rl/distill.py, il/train.py
mlflow = ["mlflow-skinny"]            # optional mirror of exp/results.jsonl (EXP_MLFLOW=1, lab/tracker.py)

[tool.setuptools.packages.find]
include = ["soccer*", "game*", "rl*", "lab*", "il*", "elo*"]
