<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Simple Soccer">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17814f"/><stop offset="1" stop-color="#0b4a2d"/>
    </linearGradient>
    <radialGradient id="b" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#cfd6d2"/>
    </radialGradient>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="22" fill="url(#g)" stroke="#06271a" stroke-width="4"/>
  <!-- pitch markings -->
  <g fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="3">
    <rect x="13" y="13" width="102" height="102" rx="12"/>
    <line x1="13" y1="64" x2="115" y2="64"/>
    <circle cx="64" cy="64" r="22"/>
  </g>
  <!-- players (Haxball-style discs) -->
  <circle cx="36" cy="88" r="13" fill="#e63946" stroke="#fff" stroke-width="4"/>
  <circle cx="92" cy="40" r="13" fill="#2a6fdb" stroke="#fff" stroke-width="4"/>
  <!-- ball -->
  <ellipse cx="66" cy="84" rx="15" ry="3.5" fill="#000" fill-opacity="0.3"/>
  <circle cx="64" cy="64" r="16" fill="url(#b)" stroke="#1d1d1f" stroke-width="3"/>
  <polygon points="64,56 71.5,61.5 68.6,70.5 59.4,70.5 56.5,61.5" fill="#1d1d1f"/>
  <g stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round">
    <line x1="64" y1="56" x2="64" y2="49"/><line x1="71.5" y1="61.5" x2="78" y2="59"/>
    <line x1="68.6" y1="70.5" x2="72.5" y2="76"/><line x1="59.4" y1="70.5" x2="55.5" y2="76"/>
    <line x1="56.5" y1="61.5" x2="50" y2="59"/>
  </g>
</svg>
